<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
</head>
<body>

    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
</head>
<body>

    <main>
        <section id="inscricao">
            <h2>Ficha de Inscrição no Workshop</h2>
            <p>Preencha os dados abaixo:</p>

            <form action="#" method="post">

                <fieldset>
                    <label for="campo-nome">Nome:</label><br>
                    <input
                        type="text"
                        name="nome-completo"
                        id="campo-nome"
                        placeholder="Informe seu nome completo"
                        size="40"
                        required
                    >
                </fieldset>

                <fieldset>
                    <label for="campo-telefone">Telefone:</label><br>
                    <input
                        type="tel"
                        name="telefone"
                        id="campo-telefone"
                        placeholder="Informe seu telefone"
                        size="40"
                        required
                    >
                </fieldset>

                <fieldset>
                    <label for="campo-email">E-mail:</label><br>
                    <input
                        type="email"
                        name="email"
                        id="campo-email"
                        placeholder="Informe seu e-mail"
                        size="40"
                        required
                    >
                </fieldset>

                <fieldset>
                    <label for="campo-nascimento">Data de nascimento:</label><br>
                    <input
                        type="date"
                        name="data-nascimento"
                        id="campo-nascimento"
                        required
                    >
                </fieldset>

                
                    >
                
            
          <fieldset>

            <legend><b>2- Preferencias do workshop</b></legend>
            <label for="campo-curso">Qual o seu interesse no workshop?</label><br>
            <select name="selecao-curso" id="campo-curso" required>
                <option value="">Selecione uma opção</option>
                <option value="Front">Front-end</option>
                <option value="back">Back-end</option>
                <option value="mobile">Mobile</option>

            </select>
        
        <input type="radio" name = "turno_escolhido" 
        id="campo-turno-manha" value="manha" checked>
        <label for="campo-turno-manha">Turno da Manhã</
            label>

        <input type="radio" name = "turno_escolhido"
        id="campo-turno-tarde" value="tarde" >
        label for="campo-turno-tarde">Turno da Tarde</
        label>
        
        <input type="radio" name = "turno_escolhido"
        id="campo-turno-noite" value="noite">
        <label for="campo-turno-noite">Turno da Noite<
            /label>

         <p></b>Topicos de interesse:</b></p>
         <input type="checkbox" name="topicos[]"
         id="topico_html" value="html">
            <label for="topico_html">HTML</label>


            <input type="checkbox" name="topicos[]"
            id="topico_css" value="css">
            <label for="topico_css">CSS</label>

            <input type="checkbox" name="topicos[]"
            id="topico_js" value="javascript">
            <label for="topico_js">JS</label>

            <br>
            <label for="campo-observacao">Observações ou 
                Duvidas </label>
                <textarea name="observacoes_adicionais"
                id="campo-observacao"  rows="4" cols="50"
                placeholder="Informe aqui os dados adicionais pertinentes ao evento..."></textarea>



        </fieldset>
        <main>
<section id="inscricao>"
        <br>
        <br>

        <button type="submit">Confirma meu cadastro</b></
button>
       button type="reset"><b>Limpar Formulario</b></button>
       
       </form>
       </main>
    
</body>
</html>
